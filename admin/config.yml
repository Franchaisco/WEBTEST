backend:
  name: git-gateway
  branch: main

media_folder: "content/uploads"
public_folder: "/content/uploads"

locale: "nl"

collections:
  - name: "site"
    label: "Algemene teksten"
    files:
      - file: "content/site.json"
        label: "Hero, over ons & contact"
        name: "site"
        fields:
          - { label: "Hero: titel", name: "hero_title", widget: "string" }
          - { label: "Hero: tekst", name: "hero_lede", widget: "text" }
          - { label: "Over ons: intro (dikgedrukte regel)", name: "about_lede", widget: "text" }
          - { label: "Over ons: paragraaf 1", name: "about_p1", widget: "text" }
          - { label: "Over ons: paragraaf 2", name: "about_p2", widget: "text" }
          - { label: "Over ons: tekst naast de cijfers", name: "about_intro", widget: "text" }
          - label: "Cijfers"
            name: "stats"
            widget: "list"
            fields:
              - { label: "Getal", name: "num", widget: "string" }
              - { label: "Omschrijving", name: "label", widget: "string" }
          - { label: "E-mailadres", name: "email", widget: "string" }
          - { label: "Telefoonnummer", name: "phone", widget: "string" }
          - { label: "Adres", name: "address", widget: "string" }

  - name: "trainingen"
    label: "Trainingen"
    files:
      - file: "content/trainings.json"
        label: "Trainingenlijst"
        name: "trainingen"
        fields:
          - label: "Trainingen"
            name: "trainingen"
            widget: "list"
            summary: "{{fields.name}}"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Beschrijving", name: "description", widget: "text" }
              - { label: "Aantal bijeenkomsten", name: "sessions", widget: "string" }
              - { label: "Tijdstip", name: "schedule", widget: "string" }

  - name: "team"
    label: "Team"
    files:
      - file: "content/team.json"
        label: "Teamleden"
        name: "team"
        fields:
          - label: "Teamleden"
            name: "team"
            widget: "list"
            summary: "{{fields.name}} — {{fields.role}}"
            fields:
              - { label: "Naam", name: "name", widget: "string" }
              - { label: "Functie", name: "role", widget: "string" }
              - { label: "Korte bio", name: "bio", widget: "text" }
              - { label: "Initialen (voor avatar)", name: "initials", widget: "string" }
              - { label: "Kleur avatar (hex-code)", name: "color", widget: "string", default: "#4a3178" }
